<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Metálico -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#5B4308"/>
    </linearGradient>

    <!-- Elemento: Folha de Louro individual -->
    <g id="leaf">
      <path d="M 0 0 C -8 -12 -5 -28 0 -35 C 5 -28 8 -12 0 0 Z" fill="url(#gold)" />
      <path d="M 0 0 L 0 -30" stroke="#684C0B" stroke-width="0.6" opacity="0.5"/>
    </g>

    <!-- Elemento: Par de Folhas de Louro -->
    <g id="leaf-pair">
      <use href="#leaf" transform="translate(-6, -3) rotate(-32) scale(0.8)"/>
      <use href="#leaf" transform="translate(6, -3) rotate(32) scale(0.8)"/>
      <use href="#leaf" transform="translate(0, -8) scale(0.95)"/>
      <circle cx="-2" cy="1" r="1.8" fill="url(#gold)"/>
      <circle cx="2" cy="1" r="1.8" fill="url(#gold)"/>
    </g>
  </defs>

  <!-- LOGO / BRASÃO CENTRAL (MONOGRAMA M/W COM COROA DE LOUROS) -->
  <g transform="translate(250, 145)">
    <!-- Louros Lado Esquerdo -->
    <path d="M -5 65 C -60 65 -95 20 -95 -30 C -95 -70 -70 -105 -30 -120" 
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <use href="#leaf-pair" transform="translate(-15, 64) rotate(-80)"/>
    <use href="#leaf-pair" transform="translate(-40, 57) rotate(-65)"/>
    <use href="#leaf-pair" transform="translate(-62, 43) rotate(-48)"/>
    <use href="#leaf-pair" transform="translate(-80, 23) rotate(-30)"/>
    <use href="#leaf-pair" transform="translate(-91, -2) rotate(-10)"/>
    <use href="#leaf-pair" transform="translate(-93, -28) rotate(10)"/>
    <use href="#leaf-pair" transform="translate(-86, -54) rotate(30)"/>
    <use href="#leaf-pair" transform="translate(-72, -77) rotate(50)"/>
    <use href="#leaf-pair" transform="translate(-51, -97) rotate(68)"/>
    <use href="#leaf-pair" transform="translate(-28, -112) rotate(85)"/>

    <!-- Louros Lado Direito (Espelhado) -->
    <path d="M 5 65 C 60 65 95 20 95 -30 C 95 -70 70 -105 30 -120" 
          fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <use href="#leaf-pair" transform="translate(15, 64) scale(-1, 1) rotate(-80)"/>
    <use href="#leaf-pair" transform="translate(40, 57) scale(-1, 1) rotate(-65)"/>
    <use href="#leaf-pair" transform="translate(62, 43) scale(-1, 1) rotate(-48)"/>
    <use href="#leaf-pair" transform="translate(80, 23) scale(-1, 1) rotate(-30)"/>
    <use href="#leaf-pair" transform="translate(91, -2) scale(-1, 1) rotate(-10)"/>
    <use href="#leaf-pair" transform="translate(93, -28) scale(-1, 1) rotate(10)"/>
    <use href="#leaf-pair" transform="translate(86, -54) scale(-1, 1) rotate(30)"/>
    <use href="#leaf-pair" transform="translate(72, -77) scale(-1, 1) rotate(50)"/>
    <use href="#leaf-pair" transform="translate(51, -97) scale(-1, 1) rotate(68)"/>
    <use href="#leaf-pair" transform="translate(28, -112) scale(-1, 1) rotate(85)"/>

    <!-- Monograma Central M / W -->
    <text x="-25" y="-30" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="42" font-weight="600" fill="url(#gold)" text-anchor="middle">M</text>
    <line x1="-22" y1="20" x2="22" y2="-45" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="25" y="28" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="42" font-weight="600" fill="url(#gold)" text-anchor="middle">W</text>
  </g>

  <!-- NOMES DOS NOIVOS -->
  <text x="250" y="285" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="600" fill="url(#gold)" letter-spacing="8" text-anchor="middle">MATHEUS</text>

  <!-- ÍCONE DIVISOR DE ALIANÇAS INTERLIGADAS -->
  <g transform="translate(250, 330)">
    <line x1="-120" y1="0" x2="-35" y2="0" stroke="url(#gold)" stroke-width="1"/>
    <line x1="35" y1="0" x2="120" y2="0" stroke="url(#gold)" stroke-width="1"/>
    <!-- Anel 1 com diamante -->
    <circle cx="-8" cy="0" r="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M -8 -12 L -5 -16 L -11 -16 Z" fill="url(#gold)"/>
    <!-- Anel 2 -->
    <circle cx="8" cy="0" r="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <!-- Símbolo & -->
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="14" font-style="italic" fill="url(#gold)" text-anchor="middle">&amp;</text>
  </g>

  <text x="250" y="405" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-size="34" font-weight="600" fill="url(#gold)" letter-spacing="8" text-anchor="middle">WÂNIA</text>

  <!-- DATA DO CASAMENTO -->
  <text x="250" y="480" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="600" fill="url(#gold)" letter-spacing="6" text-anchor="middle">
    12 | 12 | 2026
  </text>
</svg>
